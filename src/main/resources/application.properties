spring.application.name=banking-crm
server.port=8080

# ---------------------------------------------------------------------------
# Database (default: H2 file database - nothing to install)
# Switch to MySQL with:  mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/bankcrm;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Schema is owned by SQL scripts (schema-h2.sql / schema-mysql.sql), not Hibernate
spring.sql.init.mode=always
spring.sql.init.platform=h2
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Connection pool must be larger than the max bulk-load worker threads
spring.datasource.hikari.maximum-pool-size=24
spring.datasource.hikari.minimum-idle=4
spring.datasource.hikari.pool-name=crm-pool

# ---------------------------------------------------------------------------
# Hibernate JDBC batching - this is what makes bulk inserts fast.
# (Requires SEQUENCE ids; IDENTITY ids silently disable insert batching.)
# ---------------------------------------------------------------------------
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.show-sql=false

# Uploads
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ---------------------------------------------------------------------------
# Bulk loader tuning
# ---------------------------------------------------------------------------
crm.bulk.default-threads=8
crm.bulk.max-threads=16
crm.bulk.default-chunk-size=500
crm.bulk.max-chunk-size=5000
crm.bulk.max-generated-rows=500000
crm.bulk.max-stored-errors=1000
# Number of bulk jobs allowed to run at the same time; extra jobs wait in QUEUED state
crm.bulk.max-concurrent-jobs=1

logging.level.com.bank.crm=INFO
