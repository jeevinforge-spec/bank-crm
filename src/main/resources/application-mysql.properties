# MySQL profile. Create the database first:  CREATE DATABASE bankcrm;
# rewriteBatchedStatements lets the MySQL driver collapse Hibernate's JDBC batches
# into multi-row INSERTs, which is a large speed-up for bulk loading.
spring.datasource.url=jdbc:mysql://localhost:3306/bankcrm?rewriteBatchedStatements=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.sql.init.platform=mysql
spring.h2.console.enabled=false
